name: Build Houdini material OCP wheel

on:
  workflow_dispatch:

env:
  # Unique cache and package versions for the typed material-handle fork.
  OCP: 8.0.1.0-houdini-material.1
  WHEEL: 8.0.1.0.1
  VTK: 9.6.2
  VTK_MAJOR: 9.6
  OCCT: 8.0.1
  PYBIND11: 2.13
  PYWRAP: "true"
  OCP_REPOSITORY: https://github.com/handcraftedcc/OCP.git

jobs:
  sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build OCCT SDK
        uses: ./.github/actions/build-occt-sdk
        with:
          os: windows-latest
          python-version: "3.13"
          use-vtk: novtk
          vtk-suffix: "/"
          shells: "bash cmd.exe"

  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate OCP source
        uses: ./.github/actions/build-ocp-source
        with:
          os: windows-latest
          python-version: "3.13"
          plat: win_amd64

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Build proxy wheel
        shell: bash
        run: |
          cd cadquery_ocp_proxy
          sed -i.bak 's/^version = .*/version = "${{ env.WHEEL }}"/' pyproject.toml
          echo '__version__ = "${{ env.WHEEL }}"' > src/cadquery_ocp_proxy/_version.py
          uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cadquery-ocp-proxy-${{ env.WHEEL }}-cp-3.13
          path: cadquery_ocp_proxy/dist/*.whl

  wheel:
    runs-on: windows-latest
    needs: [sdk, source, proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build no-VTK wheel
        uses: ./.github/actions/build-ocp
        with:
          os: windows-latest
          python-version: "3.13"
          use-vtk: novtk
          shells: "bash cmd.exe"
          delocate: delvewheel
          plat: win_amd64
          module: "OCP.*.pyd"
          env: "DUMMY=0"
          ocp-source-tag: windows-latest

  verify:
    runs-on: windows-latest
    needs: [wheel, proxy]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cadquery-ocp-*
          merge-multiple: true
      - name: Install and exercise typed material lookup
        shell: pwsh
        run: |
          $wheels = Get-ChildItem -File -Filter *.whl
          if ($wheels.Count -lt 2) { throw "Expected both the OCP and proxy wheels, found $($wheels.Count)." }
          python -m pip install $wheels.FullName
          python -c "from OCP.BRepPrimAPI import BRepPrimAPI_MakeBox; from OCP.TCollection import TCollection_ExtendedString, TCollection_HAsciiString; from OCP.TDocStd import TDocStd_Document; from OCP.XCAFDoc import XCAFDoc_DocumentTool; d=TDocStd_Document(TCollection_ExtendedString('XmlXCAF')); s=XCAFDoc_DocumentTool.ShapeTool_s(d.Main()); m=XCAFDoc_DocumentTool.MaterialTool_s(d.Main()); l=s.AddShape(BRepPrimAPI_MakeBox(1,1,1).Shape(),False); m.SetMaterial(l,TCollection_HAsciiString('Steel'),TCollection_HAsciiString('Alloy steel'),7850.0,TCollection_HAsciiString('Mass density'),TCollection_HAsciiString('kg/m^3')); assert XCAFDoc_DocumentTool.GetMaterialData_s(l) == ('Steel','Alloy steel',7850.0,'kg/m^3'); print('typed material lookup passed')"
